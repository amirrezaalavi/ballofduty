      #     sleep 1
      #     xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
      #       node tools/ci/browser_smoke.mjs \
      #         --url "http://127.0.0.1:8099/index.html" \
      #         --browser firefox --headed \
      #         --out artifacts/browser-smoke-firefox

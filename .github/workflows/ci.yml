name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Import, smoke, export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_BIN: godot

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2 + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify engine
        run: godot --version

      - name: Pipeline
        run: tools/check.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports
          if-no-files-found: ignore

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: ballofduty-web
          path: build/web
          if-no-files-found: error

      - name: Upload server build
        uses: actions/upload-artifact@v4
        with:
          name: ballofduty-server
          path: build/server
          if-no-files-found: error
